[package]
name = "sync"
version = "0.1.0"
description = "Fast, lightweight Google Drive sync for Windows and Linux"
authors = ["schme16"]
license = "MIT"
edition = "2021"
rust-version = "1.80"

[lib]
name = "sync_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "net"] }
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"
bytes = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "http2", "gzip"] }
notify = "8"
ignore = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
rayon = "1"
parking_lot = "0.12"
anyhow = "1"
md-5 = "0.10"
sha2 = "0.10"
base64 = "0.22"
hex = "0.4"
rand = "0.8"
chrono = "0.4"
url = "2"
filetime = "0.2"
trash = "5"
dirs = "6"
gethostname = "0.5"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
keyring = { version = "3", features = ["windows-native", "sync-secret-service", "crypto-rust"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_Threading",
  "Win32_System_Registry",
  "Win32_Security",
  "Win32_System_IO",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
